# Production stack for MoNexus.
#
# Usage:
#   cp .env.example .env       # fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Local development still uses the simpler docker-compose.yml (postgres only).

services:
  postgres:
    image: postgres:16-alpine
    container_name: monexus-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - monexus

  server:
    image: ghcr.io/amo0114/monexus-server:${MONEXUS_IMAGE_TAG:-latest}
    build:
      context: ./server
      target: runtime
    pull_policy: ${MONEXUS_PULL_POLICY:-missing}
    container_name: monexus-server-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Deploy identity is fixed by the Compose file, not the env file, so a
      # staging .env cannot re-label this stack. Staging overlay hardcodes
      # staging without relaxing NODE_ENV or other production-grade checks.
      MONEXUS_DEPLOY_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>=32 chars)}
      # M3: the same persistent 32-byte base64 key must reach every server
      # instance, otherwise enrolled administrator MFA factors cannot decrypt.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required (32-byte base64)}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      USER_STATUS_CACHE_TTL_SEC: ${USER_STATUS_CACHE_TTL_SEC:-60}
      # Object storage (P0-C). When running with --profile selfhost-storage,
      # the stack ships its own MinIO; otherwise the operator points
      # STORAGE_ENDPOINT at AWS S3, R2, OSS, etc. The server's config
      # validator will refuse to boot in production if any of the four
      # core values is missing.
      # Trust proxy hops: canonical integer only (0/1/2). Must match
      # DEPLOY_TOPOLOGY (nginx=1, caddy=2, cloudflare_openresty_nginx=2).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-1500}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_PUBLIC_URL_BASE: ${STORAGE_PUBLIC_URL_BASE:-}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      # P5 controlled file delivery: private bucket (must differ from
      # STORAGE_BUCKET — startup refuses same name) + the browser-reachable
      # origin used ONLY for presigning download URLs. SigV4 signs the Host,
      # so this must be the exact public site origin nginx serves.
      DELIVERY_STORAGE_BUCKET: ${DELIVERY_STORAGE_BUCKET:?DELIVERY_STORAGE_BUCKET is required (private delivery bucket; must differ from STORAGE_BUCKET)}
      DELIVERY_STORAGE_PUBLIC_ENDPOINT: ${DELIVERY_STORAGE_PUBLIC_ENDPOINT:?DELIVERY_STORAGE_PUBLIC_ENDPOINT is required (public https origin used to presign download URLs)}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MoNexus}
      # SPEC-RAP-001: public registration and user-email protection are
      # fail-closed in production. Keep every value explicit at the Compose
      # boundary so the server cannot silently start without its dependencies.
      ABUSE_PROTECTION_MODE: ${ABUSE_PROTECTION_MODE:?ABUSE_PROTECTION_MODE is required (enforce in production)}
      ABUSE_HASH_KEY: ${ABUSE_HASH_KEY:?ABUSE_HASH_KEY is required (32-byte base64)}
      HUMAN_VERIFICATION_PROVIDER: ${HUMAN_VERIFICATION_PROVIDER:-altcha}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:-}
      ALTCHA_MAX_NUMBER: ${ALTCHA_MAX_NUMBER:-100000}
      ALTCHA_CHALLENGE_TTL_SEC: ${ALTCHA_CHALLENGE_TTL_SEC:-120}
      ALTCHA_SOLVE_TIMEOUT_MS: ${ALTCHA_SOLVE_TIMEOUT_MS:-20000}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      # SPEC-LEGAL-001: keep the public documents and consent policy explicit
      # at the Compose boundary. Production configuration rejects enabled pages
      # without enforce, and rejects fixture documents entirely.
      LEGAL_PAGES_ENABLED: ${LEGAL_PAGES_ENABLED:-false}
      LEGAL_PAGES_ENFORCEMENT: ${LEGAL_PAGES_ENFORCEMENT:-off}
      LEGAL_PAGES_FIXTURE_PATH: ${LEGAL_PAGES_FIXTURE_PATH:-}
      # SPEC-VALUE-POLICY-P1-001: production stays off until D-02.
      POINT_VALUE_POLICY_MODE: ${POINT_VALUE_POLICY_MODE:-off}
      # Recharge is fail-closed by default. admin_sandbox is the only mode
      # allowed to load Simulator on a production deploy and still requires
      # the separate explicit enable flag plus admin MFA at confirmation.
      RECHARGE_MODE: ${RECHARGE_MODE:-disabled}
      RECHARGE_ACCEPT_NEW_ORDERS: ${RECHARGE_ACCEPT_NEW_ORDERS:-false}
      ADMIN_SANDBOX_PAYMENT_ENABLED: ${ADMIN_SANDBOX_PAYMENT_ENABLED:-false}
      RECHARGE_ENABLED_CURRENCIES: ${RECHARGE_ENABLED_CURRENCIES:-}
      PAYMENT_REGISTERED_PROVIDERS: ${PAYMENT_REGISTERED_PROVIDERS:-}
      PAYMENT_ENABLED_PROVIDERS: ${PAYMENT_ENABLED_PROVIDERS:-}
      # Payment observations carry encrypted provider payloads. Keep the
      # shared public origin and VMQFox live-adapter credentials explicit at
      # the Compose boundary; values present only in .env do not otherwise
      # reach the server container.
      PAYMENT_EVENT_ENCRYPTION_KEY: ${PAYMENT_EVENT_ENCRYPTION_KEY:-}
      PAYMENT_WEBHOOK_PUBLIC_BASE_URL: ${PAYMENT_WEBHOOK_PUBLIC_BASE_URL:-}
      VMQFOX_MODE: ${VMQFOX_MODE:-disabled}
      VMQFOX_BASE_URL: ${VMQFOX_BASE_URL:-}
      VMQFOX_ACCOUNT_KEY: ${VMQFOX_ACCOUNT_KEY:-vmqfox-primary}
      VMQFOX_MERCHANT_KEY: ${VMQFOX_MERCHANT_KEY:-}
      VMQFOX_MAX_AMOUNT_MINOR: ${VMQFOX_MAX_AMOUNT_MINOR:-100000}
      VMQFOX_REQUEST_TIMEOUT_MS: ${VMQFOX_REQUEST_TIMEOUT_MS:-5000}
      VMQFOX_PROTOCOL_VERSION: ${VMQFOX_PROTOCOL_VERSION:-2}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-false}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-100}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-80}
      REDIS_CIRCUIT_ERROR_THRESHOLD: ${REDIS_CIRCUIT_ERROR_THRESHOLD:-5}
      REDIS_CIRCUIT_OPEN_MS: ${REDIS_CIRCUIT_OPEN_MS:-30000}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-monexus:prod}
      CACHE_PRODUCT_LIST: ${CACHE_PRODUCT_LIST:-true}
      CACHE_PRODUCT_DETAIL: ${CACHE_PRODUCT_DETAIL:-true}
      CACHE_PRODUCT_REVIEWS: ${CACHE_PRODUCT_REVIEWS:-true}
      CACHE_PRODUCT_LIST_VERSION_COALESCE_MS: ${CACHE_PRODUCT_LIST_VERSION_COALESCE_MS:-10000}
      CACHE_MAX_VALUE_BYTES: ${CACHE_MAX_VALUE_BYTES:-524288}
      PORTABLE_BACKUP_WORK_DIR: ${PORTABLE_BACKUP_WORK_DIR:-/tmp/monexus-portable-backups}
      PORTABLE_BACKUP_MAX_BYTES: ${PORTABLE_BACKUP_MAX_BYTES:-2147483648}
      PORTABLE_RESTORE_BOOTSTRAP_TOKEN: ${PORTABLE_RESTORE_BOOTSTRAP_TOKEN:-}
      # P7: merchant webhook secrets are AES-256-GCM encrypted at rest. The
      # server config also enforces this key in production; list it here so a
      # value in Compose's .env actually reaches the container.
      WEBHOOK_SECRET_ENC_KEY: ${WEBHOOK_SECRET_ENC_KEY:?WEBHOOK_SECRET_ENC_KEY is required (64 hex chars)}
      AUTO_PROVISION_ALLOW_INSECURE_TARGETS: ${AUTO_PROVISION_ALLOW_INSECURE_TARGETS:-false}
      # Optional platform FakaBridge/Xboard integration. Keep all unset until
      # it is enabled; URL and secret are validated as an all-or-nothing pair.
      FAKA_BRIDGE_URL: ${FAKA_BRIDGE_URL:-}
      FAKA_BRIDGE_STATUS_URL: ${FAKA_BRIDGE_STATUS_URL:-}
      FAKA_BRIDGE_REVOKE_URL: ${FAKA_BRIDGE_REVOKE_URL:-}
      FAKA_BRIDGE_SECRET: ${FAKA_BRIDGE_SECRET:-}
      FAKA_BRIDGE_TIMEOUT_MS: ${FAKA_BRIDGE_TIMEOUT_MS:-5000}
      FAKA_BRIDGE_MAX_ATTEMPTS: ${FAKA_BRIDGE_MAX_ATTEMPTS:-3}
      FAKA_BRIDGE_PANEL_URL: ${FAKA_BRIDGE_PANEL_URL:-}
      FAKA_BRIDGE_ALLOW_INSECURE_TARGETS: ${FAKA_BRIDGE_ALLOW_INSECURE_TARGETS:-false}
      # SPEC-NOTIFY-001: in-app order notifications. Default false for safe
      # rollout; set NOTIFICATION_ENABLED=true in the VPS .env to enable.
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-false}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      NOTIFICATION_EXPIRY_DAYS: ${NOTIFICATION_EXPIRY_DAYS:-90}
      NOTIFICATION_REALTIME_ENABLED: ${NOTIFICATION_REALTIME_ENABLED:-false}
      NOTIFICATION_REALTIME_HEARTBEAT_MS: ${NOTIFICATION_REALTIME_HEARTBEAT_MS:-20000}
      NOTIFICATION_REALTIME_MAX_CONNECTIONS_PER_USER: ${NOTIFICATION_REALTIME_MAX_CONNECTIONS_PER_USER:-5}
      NOTIFICATION_REALTIME_MAX_CONNECTIONS_PER_IP: ${NOTIFICATION_REALTIME_MAX_CONNECTIONS_PER_IP:-20}
      NOTIFICATION_REALTIME_MAX_CONNECTIONS: ${NOTIFICATION_REALTIME_MAX_CONNECTIONS:-1000}
      NOTIFICATION_REALTIME_MAX_BUFFER_BYTES: ${NOTIFICATION_REALTIME_MAX_BUFFER_BYTES:-65536}
      NOTIFICATION_REALTIME_CONNECT_RATE_LIMIT_MAX: ${NOTIFICATION_REALTIME_CONNECT_RATE_LIMIT_MAX:-30}
      NOTIFICATION_REALTIME_SHUTDOWN_GRACE_MS: ${NOTIFICATION_REALTIME_SHUTDOWN_GRACE_MS:-5000}
      DEPLOY_TOPOLOGY: ${DEPLOY_TOPOLOGY:-nginx}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - monexus

  redis:
    image: redis:7-alpine
    container_name: monexus-redis-prod
    restart: unless-stopped
    # This is the deliberately single-node production limiter/cache store.
    # It stays on the private Compose network; AOF preserves its state across
    # container or host restarts, but does not claim host-level HA.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata-prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - monexus

  # Production-only monitoring stays on the private Compose network. The
  # profile is deliberately opt-in so staging and local production-like
  # rehearsals do not start real notification delivery by accident.
  alertmanager:
    image: prom/alertmanager:v0.30.0@sha256:abb750ac7b63116761c16dd481ae92496fbe04721686c0920f0fa4d0728cd4a6
    pull_policy: missing
    container_name: monexus-alertmanager-prod
    restart: unless-stopped
    profiles: [production-monitoring]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    secrets:
      - source: monexus-alertmanager-smtp-password
        target: alertmanager_smtp_password
    volumes:
      - /opt/monexus-monitoring/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata-prod:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - monexus

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    pull_policy: missing
    container_name: monexus-prometheus-prod
    restart: unless-stopped
    profiles: [production-monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    depends_on:
      server:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    secrets:
      - source: monexus-prometheus-metrics-token
        target: metrics_token
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/operations/value-policy-alerts.rules.yml:/etc/prometheus/rules/value-policy-alerts.rules.yml:ro
      - ./docs/operations/payment-alerts.rules.yml:/etc/prometheus/rules/payment-alerts.rules.yml:ro
      - prometheusdata-prod:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - monexus

  # Self-hosted S3-compatible storage. Skip this if you point
  # STORAGE_ENDPOINT at an external provider (AWS S3 / R2 / OSS / etc.)
  # by leaving the `selfhost-storage` profile unset.
  minio:
    image: minio/minio:latest
    container_name: monexus-minio-prod
    restart: unless-stopped
    profiles: [selfhost-storage]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - miniodata-prod:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monexus

  # P5: the delivery bucket is created WITHOUT any anonymous policy — paid
  # files are only reachable through short-lived presigned URLs. Never run
  # `mc anonymous set download` against it.
  minio-init:
    image: minio/mc:latest
    profiles: [selfhost-storage]
    depends_on:
      minio:
        condition: service_healthy
    # Keep credentials available when backup.sh / restore-objects-check.sh
    # replace this service's entrypoint with a one-shot MinIO client command.
    # The values remain inside the private Compose network and are never
    # published as ports or logged by the scripts.
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      DELIVERY_STORAGE_BUCKET: ${DELIVERY_STORAGE_BUCKET:-monexus-files}
    # Use Compose's escaped dollar syntax so secrets are expanded only by the
    # container shell, not interpolated into Docker's entrypoint metadata.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${STORAGE_ACCESS_KEY}" "$${STORAGE_SECRET_KEY}"
        mc mb --ignore-existing local/"$${STORAGE_BUCKET}"
        mc anonymous set download local/"$${STORAGE_BUCKET}"
        mc mb --ignore-existing local/"$${DELIVERY_STORAGE_BUCKET:-monexus-files}"
    networks:
      - monexus

  # Local/staging-only SMTP capture service. Do not enable this profile for
  # real production SMTP; point SMTP_HOST at the provider instead.
  mailpit:
    image: axllent/mailpit:latest
    container_name: monexus-mailpit-staging
    restart: unless-stopped
    profiles: [staging-mail]
    ports:
      # Keep captured verification/reset messages off the public network. QA
      # reaches this UI through an SSH tunnel on the dedicated staging host.
      - "127.0.0.1:${MAILPIT_WEB_PORT:-18082}:8025"
    networks:
      - monexus

  web:
    image: ghcr.io/amo0114/monexus-web:${MONEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    pull_policy: ${MONEXUS_PULL_POLICY:-missing}
    container_name: monexus-web-prod
    restart: unless-stopped
    environment:
      # Used by nginx's /uploads/ proxy template when bundled MinIO is enabled.
      STORAGE_BUCKET: ${STORAGE_BUCKET:-monexus-uploads}
      # Used by nginx's presigned-download passthrough template (P5).
      DELIVERY_STORAGE_BUCKET: ${DELIVERY_STORAGE_BUCKET:-monexus-files}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monexus

volumes:
  pgdata-prod:
  miniodata-prod:
  redisdata-prod:
  prometheusdata-prod:
  alertmanagerdata-prod:

secrets:
  monexus-prometheus-metrics-token:
    file: /opt/monexus-monitoring/secrets/metrics_token
  monexus-alertmanager-smtp-password:
    file: /opt/monexus-monitoring/secrets/smtp_password

networks:
  monexus:
    driver: bridge
