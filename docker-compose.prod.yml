# Production stack for MoNexus.
#
# Usage:
#   cp .env.example .env       # fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Local development still uses the simpler docker-compose.yml (postgres only).

services:
  postgres:
    image: postgres:16-alpine
    container_name: monexus-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - monexus

  server:
    image: ghcr.io/amo0114/monexus-server:${MONEXUS_IMAGE_TAG:-latest}
    build:
      context: ./server
      target: runtime
    pull_policy: ${MONEXUS_PULL_POLICY:-missing}
    container_name: monexus-server-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>=32 chars)}
      # M3: the same persistent 32-byte base64 key must reach every server
      # instance, otherwise enrolled administrator MFA factors cannot decrypt.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required (32-byte base64)}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      USER_STATUS_CACHE_TTL_SEC: ${USER_STATUS_CACHE_TTL_SEC:-60}
      # Object storage (P0-C). When running with --profile selfhost-storage,
      # the stack ships its own MinIO; otherwise the operator points
      # STORAGE_ENDPOINT at AWS S3, R2, OSS, etc. The server's config
      # validator will refuse to boot in production if any of the four
      # core values is missing.
      # Trust proxy hops: nginx (the web service in front of the server)
      # sets X-Forwarded-For; TRUST_PROXY=1 lets express-rate-limit key on
      # the real client IP instead of the nginx container's internal IP.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_PUBLIC_URL_BASE: ${STORAGE_PUBLIC_URL_BASE:-}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      # P5 controlled file delivery: private bucket (must differ from
      # STORAGE_BUCKET — startup refuses same name) + the browser-reachable
      # origin used ONLY for presigning download URLs. SigV4 signs the Host,
      # so this must be the exact public site origin nginx serves.
      DELIVERY_STORAGE_BUCKET: ${DELIVERY_STORAGE_BUCKET:?DELIVERY_STORAGE_BUCKET is required (private delivery bucket; must differ from STORAGE_BUCKET)}
      DELIVERY_STORAGE_PUBLIC_ENDPOINT: ${DELIVERY_STORAGE_PUBLIC_ENDPOINT:?DELIVERY_STORAGE_PUBLIC_ENDPOINT is required (public https origin used to presign download URLs)}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MoNexus}
      # SPEC-RAP-001: public registration and user-email protection are
      # fail-closed in production. Keep every value explicit at the Compose
      # boundary so the server cannot silently start without its dependencies.
      ABUSE_PROTECTION_MODE: ${ABUSE_PROTECTION_MODE:?ABUSE_PROTECTION_MODE is required (enforce in production)}
      ABUSE_HASH_KEY: ${ABUSE_HASH_KEY:?ABUSE_HASH_KEY is required (32-byte base64)}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:?TURNSTILE_ALLOWED_HOSTNAMES is required}
      # SPEC-LEGAL-001: keep the public documents and consent policy explicit
      # at the Compose boundary. Production configuration rejects enabled pages
      # without enforce, and rejects fixture documents entirely.
      LEGAL_PAGES_ENABLED: ${LEGAL_PAGES_ENABLED:-false}
      LEGAL_PAGES_ENFORCEMENT: ${LEGAL_PAGES_ENFORCEMENT:-off}
      LEGAL_PAGES_FIXTURE_PATH: ${LEGAL_PAGES_FIXTURE_PATH:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-false}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-100}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-80}
      REDIS_CIRCUIT_ERROR_THRESHOLD: ${REDIS_CIRCUIT_ERROR_THRESHOLD:-5}
      REDIS_CIRCUIT_OPEN_MS: ${REDIS_CIRCUIT_OPEN_MS:-30000}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-monexus:prod}
      CACHE_PRODUCT_LIST: ${CACHE_PRODUCT_LIST:-true}
      CACHE_PRODUCT_DETAIL: ${CACHE_PRODUCT_DETAIL:-true}
      CACHE_PRODUCT_REVIEWS: ${CACHE_PRODUCT_REVIEWS:-true}
      CACHE_PRODUCT_LIST_VERSION_COALESCE_MS: ${CACHE_PRODUCT_LIST_VERSION_COALESCE_MS:-10000}
      CACHE_MAX_VALUE_BYTES: ${CACHE_MAX_VALUE_BYTES:-524288}
      PORTABLE_BACKUP_WORK_DIR: ${PORTABLE_BACKUP_WORK_DIR:-/tmp/monexus-portable-backups}
      PORTABLE_BACKUP_MAX_BYTES: ${PORTABLE_BACKUP_MAX_BYTES:-2147483648}
      PORTABLE_RESTORE_BOOTSTRAP_TOKEN: ${PORTABLE_RESTORE_BOOTSTRAP_TOKEN:-}
      # P7: merchant webhook secrets are AES-256-GCM encrypted at rest. The
      # server config also enforces this key in production; list it here so a
      # value in Compose's .env actually reaches the container.
      WEBHOOK_SECRET_ENC_KEY: ${WEBHOOK_SECRET_ENC_KEY:?WEBHOOK_SECRET_ENC_KEY is required (64 hex chars)}
      AUTO_PROVISION_ALLOW_INSECURE_TARGETS: ${AUTO_PROVISION_ALLOW_INSECURE_TARGETS:-false}
      # Optional platform FakaBridge/Xboard integration. Keep all unset until
      # it is enabled; URL and secret are validated as an all-or-nothing pair.
      FAKA_BRIDGE_URL: ${FAKA_BRIDGE_URL:-}
      FAKA_BRIDGE_STATUS_URL: ${FAKA_BRIDGE_STATUS_URL:-}
      FAKA_BRIDGE_REVOKE_URL: ${FAKA_BRIDGE_REVOKE_URL:-}
      FAKA_BRIDGE_SECRET: ${FAKA_BRIDGE_SECRET:-}
      FAKA_BRIDGE_TIMEOUT_MS: ${FAKA_BRIDGE_TIMEOUT_MS:-5000}
      FAKA_BRIDGE_MAX_ATTEMPTS: ${FAKA_BRIDGE_MAX_ATTEMPTS:-3}
      FAKA_BRIDGE_PANEL_URL: ${FAKA_BRIDGE_PANEL_URL:-}
      FAKA_BRIDGE_ALLOW_INSECURE_TARGETS: ${FAKA_BRIDGE_ALLOW_INSECURE_TARGETS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - monexus

  redis:
    image: redis:7-alpine
    container_name: monexus-redis-prod
    restart: unless-stopped
    # This is the deliberately single-node production limiter/cache store.
    # It stays on the private Compose network; AOF preserves its state across
    # container or host restarts, but does not claim host-level HA.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata-prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - monexus

  # Self-hosted S3-compatible storage. Skip this if you point
  # STORAGE_ENDPOINT at an external provider (AWS S3 / R2 / OSS / etc.)
  # by leaving the `selfhost-storage` profile unset.
  minio:
    image: minio/minio:latest
    container_name: monexus-minio-prod
    restart: unless-stopped
    profiles: [selfhost-storage]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - miniodata-prod:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monexus

  # P5: the delivery bucket is created WITHOUT any anonymous policy — paid
  # files are only reachable through short-lived presigned URLs. Never run
  # `mc anonymous set download` against it.
  minio-init:
    image: minio/mc:latest
    profiles: [selfhost-storage]
    depends_on:
      minio:
        condition: service_healthy
    # Keep credentials available when backup.sh / restore-objects-check.sh
    # replace this service's entrypoint with a one-shot MinIO client command.
    # The values remain inside the private Compose network and are never
    # published as ports or logged by the scripts.
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      DELIVERY_STORAGE_BUCKET: ${DELIVERY_STORAGE_BUCKET:-monexus-files}
    # Use Compose's escaped dollar syntax so secrets are expanded only by the
    # container shell, not interpolated into Docker's entrypoint metadata.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${STORAGE_ACCESS_KEY}" "$${STORAGE_SECRET_KEY}"
        mc mb --ignore-existing local/"$${STORAGE_BUCKET}"
        mc anonymous set download local/"$${STORAGE_BUCKET}"
        mc mb --ignore-existing local/"$${DELIVERY_STORAGE_BUCKET:-monexus-files}"
    networks:
      - monexus

  # Local/staging-only SMTP capture service. Do not enable this profile for
  # real production SMTP; point SMTP_HOST at the provider instead.
  mailpit:
    image: axllent/mailpit:latest
    container_name: monexus-mailpit-staging
    restart: unless-stopped
    profiles: [staging-mail]
    ports:
      # Keep captured verification/reset messages off the public network. QA
      # reaches this UI through an SSH tunnel on the dedicated staging host.
      - "127.0.0.1:${MAILPIT_WEB_PORT:-18082}:8025"
    networks:
      - monexus

  web:
    image: ghcr.io/amo0114/monexus-web:${MONEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    pull_policy: ${MONEXUS_PULL_POLICY:-missing}
    container_name: monexus-web-prod
    restart: unless-stopped
    environment:
      # Used by nginx's /uploads/ proxy template when bundled MinIO is enabled.
      STORAGE_BUCKET: ${STORAGE_BUCKET:-monexus-uploads}
      # Used by nginx's presigned-download passthrough template (P5).
      DELIVERY_STORAGE_BUCKET: ${DELIVERY_STORAGE_BUCKET:-monexus-files}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - monexus

volumes:
  pgdata-prod:
  miniodata-prod:
  redisdata-prod:

networks:
  monexus:
    driver: bridge
