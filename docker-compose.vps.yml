# VPS host-proxy overlay for docker-compose.prod.yml.
#
# It keeps the application web container private to the host. Caddy (or an
# existing host reverse proxy) owns public :80/:443 outside this Compose
# project and proxies to the loopback port below. Run it with the base file:
#   docker compose -f docker-compose.prod.yml -f docker-compose.vps.yml ...
#
# Docker Compose v2.24.4+ is required for the !override tag below.

services:
  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-18089}:80"
