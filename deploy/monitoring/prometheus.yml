global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production
    service: monexus-api

rule_files:
  - /etc/prometheus/rules/value-policy-alerts.rules.yml
  - /etc/prometheus/rules/payment-alerts.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: monexus
    scheme: http
    metrics_path: /api/metrics
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets:
          - server:3000
