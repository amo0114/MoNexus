<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" type="image/x-icon" href="/brand/ledger-knot/favicon.ico" />
    <link
      id="brand-favicon-16"
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/brand/ledger-knot/favicon-light-16.png"
      data-brand-favicon-size="16"
    />
    <link
      id="brand-favicon-32"
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/ledger-knot/favicon-light-32.png"
      data-brand-favicon-size="32"
    />
    <link
      id="brand-favicon-48"
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/brand/ledger-knot/favicon-light-48.png"
      data-brand-favicon-size="48"
    />
    <link
      id="brand-apple-touch-icon"
      rel="apple-touch-icon"
      sizes="180x180"
      href="/brand/ledger-knot/favicon-light-180.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="brand-theme-color" name="theme-color" content="#F8FAFC" />
    <meta name="description" content="MoNexus - 精选数字好物，做任务赚积分，免费兑换数字资源" />
    <title>MoNexus - 精选数字好物</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Theme boot: apply the stored theme before first paint to avoid FOUC.
      // A visitor without an explicit choice starts in the product-default
      // ink theme. Legacy 'default' remains an explicit light choice.
      // ink 主题使用 black 系列品牌素材（favicon-black-* / mark-black）。
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var variant = 'ink';
          if (t === 'soft' || t === 'ink') {
            document.documentElement.setAttribute('data-theme', t);
            variant = t;
          } else if (t === 'dark') {
            document.documentElement.classList.add('dark');
            variant = 'dark';
          } else if (t === 'light' || t === 'default') {
            variant = 'light';
          } else {
            document.documentElement.setAttribute('data-theme', 'ink');
          }
          var asset = variant === 'ink' ? 'black' : variant;

          var icons = document.querySelectorAll('link[data-brand-favicon-size]');
          for (var i = 0; i < icons.length; i++) {
            var size = icons[i].getAttribute('data-brand-favicon-size');
            if (size) {
              icons[i].setAttribute('href', '/brand/ledger-knot/favicon-' + asset + '-' + size + '.png');
            }
          }

          var appleTouchIcon = document.getElementById('brand-apple-touch-icon');
          if (appleTouchIcon) {
            appleTouchIcon.setAttribute('href', '/brand/ledger-knot/favicon-' + asset + '-180.png');
          }

          var themeColor = document.getElementById('brand-theme-color');
          if (themeColor) {
            themeColor.setAttribute(
              'content',
              variant === 'dark' ? '#0A0A14' : variant === 'soft' ? '#FFF8EC' : variant === 'ink' ? '#EEF0EE' : '#F8FAFC'
            );
          }
        } catch (e) {}
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
