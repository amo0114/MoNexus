<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">MoNexus Mortise Link brand-concept board</title>
  <desc id="desc">A precise asymmetric three-plane joinery mark, with a favicon, badge, monochrome proof, and theme proof.</desc>
  <defs>
    <!-- Three independent planes. Their empty seams, rather than paint effects, make the depth. -->
    <g id="mortise-link" transform="skewX(-8)">
      <path fill="currentColor" d="M14 35 31 18H118L101 35H52V76L31 88V45H14Z"/>
      <path fill="currentColor" d="M80 47 97 36 122 51V94L105 105V63H80Z"/>
      <path fill="currentColor" d="M53 73H101V90H70V104H53Z"/>
    </g>
    <style>
      .eyebrow { font: 600 20px Arial, Helvetica, sans-serif; letter-spacing: 1.6px; fill: #737780; }
      .note { font: 400 18px Arial, Helvetica, sans-serif; fill: #737780; }
      .wordmark { font: 700 78px Arial, Helvetica, sans-serif; letter-spacing: 8px; fill: #090A19; }
      .small-wordmark { font: 700 36px Arial, Helvetica, sans-serif; letter-spacing: 4px; fill: #090A19; }
      .mini-wordmark { font: 700 23px Arial, Helvetica, sans-serif; letter-spacing: 3px; }
      .guide { stroke: #E4E7EC; stroke-width: 2; }
      .grid { stroke: #D7DAE0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F8FAFC"/>
  <line x1="0" y1="606" x2="1600" y2="606" class="guide"/>
  <line x1="1158" y1="0" x2="1158" y2="606" class="guide"/>

  <text x="60" y="64" class="eyebrow">PRIMARY MARK — MORTISE LINK</text>
  <text x="60" y="96" class="note">Three unequal planes · one displaced aperture · no mirrored axis</text>

  <g style="color:#6366F1" transform="translate(92 145) scale(3.78)"><use xlink:href="#mortise-link"/></g>
  <text x="616" y="335" class="wordmark">MONEXUS</text>
  <text x="622" y="380" class="note">A STRUCTURAL MARK FOR THE EXCHANGE LAYER</text>

  <text x="1215" y="64" class="eyebrow">16PX FAVICON</text>
  <g transform="translate(1224 114)">
    <rect x="0" y="0" width="164" height="164" fill="#FFF" stroke="#D7DAE0" stroke-width="2"/>
    <g class="grid"><path d="M20 0V164M41 0V164M61 0V164M82 0V164M102 0V164M123 0V164M143 0V164M0 20H164M0 41H164M0 61H164M0 82H164M0 102H164M0 123H164M0 143H164"/></g>
    <g style="color:#6366F1" transform="translate(10 22) scale(1.1)"><use xlink:href="#mortise-link"/></g>
  </g>
  <text x="1215" y="313" class="note">The aperture holds a clear</text>
  <text x="1215" y="339" class="note">four-pixel breathing space.</text>

  <line x1="1208" y1="388" x2="1526" y2="388" class="guide"/>
  <text x="1215" y="443" class="eyebrow">TRUST BADGE</text>
  <path d="M1258 483 1310 506V565C1310 603 1287 627 1258 642 1229 627 1206 603 1206 565V506Z" fill="none" stroke="#090A19" stroke-width="6"/>
  <g style="color:#6366F1" transform="translate(1226 520) scale(.48)"><use xlink:href="#mortise-link"/></g>
  <text x="1340" y="547" class="eyebrow" style="fill:#090A19">SECURE BY</text>
  <text x="1340" y="582" class="mini-wordmark" style="fill:#090A19">MONEXUS</text>

  <text x="60" y="668" class="eyebrow">MONOCHROME PROOF</text>
  <g style="color:#090A19" transform="translate(78 694) scale(1.62)"><use xlink:href="#mortise-link"/></g>
  <text x="337" y="828" class="small-wordmark">MONEXUS</text>
  <rect x="661" y="692" width="390" height="176" fill="#090A19"/>
  <g style="color:#FFF" transform="translate(694 721) scale(1.2)"><use xlink:href="#mortise-link"/></g>
  <text x="880" y="814" class="small-wordmark" style="fill:#FFF">MONEXUS</text>
  <g style="color:#737780" transform="translate(1086 694) scale(1.62)"><use xlink:href="#mortise-link"/></g>
  <text x="1340" y="828" class="small-wordmark" style="fill:#737780">MONEXUS</text>

  <line x1="0" y1="908" x2="1600" y2="908" class="guide"/>
  <line x1="533" y1="908" x2="533" y2="1100" class="guide"/>
  <line x1="1066" y1="908" x2="1066" y2="1100" class="guide"/>
  <text x="60" y="958" class="eyebrow">PROJECT LIGHT</text>
  <text x="60" y="986" class="note">#6366F1 on #F8FAFC</text>
  <g style="color:#6366F1" transform="translate(70 1001) scale(.72)"><use xlink:href="#mortise-link"/></g>
  <text x="187" y="1069" class="mini-wordmark" style="fill:#090A19">MONEXUS</text>

  <rect x="533" y="908" width="533" height="192" fill="#0A0A14"/>
  <text x="593" y="958" class="eyebrow" style="fill:#B1B5C1">PROJECT DARK</text>
  <text x="593" y="986" class="note" style="fill:#B1B5C1">#818CF8 on #0A0A14</text>
  <g style="color:#818CF8" transform="translate(592 1001) scale(.72)"><use xlink:href="#mortise-link"/></g>
  <text x="709" y="1069" class="mini-wordmark" style="fill:#FFF">MONEXUS</text>

  <rect x="1066" y="908" width="534" height="192" fill="#FFF8EC"/>
  <text x="1126" y="958" class="eyebrow">PROJECT SOFT</text>
  <text x="1126" y="986" class="note">#FF8C42 on #FFF8EC</text>
  <g style="color:#FF8C42" transform="translate(1125 1001) scale(.72)"><use xlink:href="#mortise-link"/></g>
  <text x="1242" y="1069" class="mini-wordmark" style="fill:#090A19">MONEXUS</text>
</svg>
