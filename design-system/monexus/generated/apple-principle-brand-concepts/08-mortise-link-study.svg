<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <rect width="900" height="620" fill="#F8FAFC"/>
  <g transform="translate(120 115) scale(3.5)" style="color:#6366F1">
    <!-- rear plane: deliberately longer and open -->
    <path fill="currentColor" d="M14 28 31 18H118L101 28H48V75L31 85V38H14Z"/>
    <!-- side plane: shorter, lower and shifted right -->
    <path fill="currentColor" d="M79 43 96 33 122 48V96L105 106V59H79Z"/>
    <!-- near plane: crosses the lower route, creating the mortise -->
    <path fill="currentColor" d="M48 70H101V87H65V103L48 93Z"/>
    <!-- the single open seam is the depth cue -->
    <path fill="#F8FAFC" d="M48 64 59 70 50 76 48 75Z"/>
  </g>
  <text x="520" y="230" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="8" fill="#090A19">MONEXUS</text>
  <text x="527" y="280" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="2" fill="#737780">MORTISE LINK — ASYMMETRIC SPATIAL STUDY</text>
</svg>
