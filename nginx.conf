# SEC-06: /uploads replaces object-storage error bodies, so keep the upstream
# status in the access log for troubleshooting.
log_format monexus_uploads '$remote_addr [$time_local] "$request" $status '
                           'upstream_status=$upstream_status request_id=$request_id';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reasonable defaults. Keep ordinary API and image uploads constrained.
  client_max_body_size 10m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml+rss application/atom+xml image/svg+xml;
  gzip_min_length 1024;

  # SEC-03: browser security headers for everything nginx serves itself (the
  # SPA document, hashed assets, public files and /uploads). /api responses
  # get theirs from helmet in Express, so /api locations must not repeat them.
  # add_header is not inherited by a location that sets its own, so each
  # static location below lists the full set.
  # - script-src has no 'unsafe-inline': the theme boot is /theme-boot.js.
  # - style-src keeps 'unsafe-inline' for runtime-injected component styles.
  # - Turnstile needs script/frame access to challenges.cloudflare.com; the
  #   ALTCHA solver runs in a blob: worker.
  # - img/media allow https: for payment QR codes and external product media.
  # - form-action allows https: because recharge submits a POST form to the
  #   payment provider.
  # - If VITE_SENTRY_DSN is enabled, add its ingest origin to connect-src.
  set $monexus_csp "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https:";

  # X-Forwarded-For is appended here (`$proxy_add_x_forwarded_for`). The hop
  # count at Express must match the topology: nginx-only = 1; Caddy or
  # Cloudflare→OpenResty in front of this server = 2. OpenResty must overwrite
  # (not append) XFF with the restored $remote_addr so the leftmost spoofed
  # client value never becomes a trusted hop.

  # Hashed asset files (Vite emits content-hashed names) can be cached forever.
  location /assets/ {
    # SEC-07: the default ETag is mtime+size, i.e. the build time. File names
    # already carry a content hash, so immutable caching needs no validator
    # (the image also pins asset mtimes, which Last-Modified would expose).
    etag off;
    # One header: `expires` would add a second Cache-Control (SEC-09).
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $monexus_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri =404;
  }

  # SPEC-NOTIFY-RT-001: exact SSE stream location. Exact match wins over /api/;
  # buffering/cache/gzip off so each event+heartbeat arrives immediately. The
  # 5m read timeout is an IDLE timeout between reads, not a total-response cap;
  # the 20s heartbeat keeps it alive indefinitely. HTTP/1.1 + empty Connection.
  location = /api/notifications/stream {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    # Expose the no-buffer contract to the external proxy. Nginx consumes
    # upstream X-Accel-Buffering as a control header instead of reliably
    # returning it to the client.
    add_header X-Accel-Buffering "no" always;
    proxy_read_timeout 5m;
    proxy_send_timeout 1m;
  }

  # API proxy — `server` resolves to the backend container on the
  # compose network. Cookies and Authorization headers pass through
  # unchanged so the cookie-based refresh-token flow keeps working.
  location ^~ /api/uploads/product-video-signed/ {
    access_log off;
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # Portable migration bundles are deliberately the only large request body.
  # The backend still requires an active administrator, a passphrase and an
  # empty target instance before it reads the archive. External reverse
  # proxies must apply an equivalent limit only for this exact endpoint.
  location = /api/admin/portable-backups/import {
    client_max_body_size 2g;
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
  }

  # A downloaded bundle can be much larger than normal API responses. This
  # only relaxes transfer timeouts; it does not change authentication or the
  # ordinary request-body limit.
  location ~ ^/api/admin/portable-backups/[0-9a-f-]+/download$ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
  }

  # P5 controlled file delivery: streaming upload endpoint. The only relaxed
  # body limit besides portable-backup import — scoped to this exact route so
  # the ordinary 10m API limit stays intact. Request buffering is off because
  # the backend streams the multipart body straight into object storage.
  # If the deliveryFileMaxMb system config is raised above 100, raise this too.
  location = /api/uploads/delivery-file {
    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
  }

  # Product promotional video: bounded streaming upload; keep ordinary API limits.
  location = /api/uploads/product-video {
    client_max_body_size 95m;
    client_body_timeout 125s;
    proxy_request_buffering off;
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 250s;
    proxy_send_timeout 125s;
  }

  # P5 controlled file delivery: presigned download passthrough. Presigned
  # URLs are path-style /<bucket>/<key>?X-Amz-... and SigV4 covers the exact
  # path, the query string AND the Host header — forward all three verbatim.
  # Any rewrite, added/dropped query parameter, or Host change breaks the
  # signature. The bucket stays private in MinIO (no anonymous policy); an
  # unsigned request through this location gets 403 from MinIO itself.
  location ^~ /${DELIVERY_STORAGE_BUCKET}/ {
    # Presigned query strings are bearer credentials.
    access_log off;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $minio_host minio;
    proxy_pass http://$minio_host:9000;
    proxy_http_version 1.1;
    # $http_host（原样含端口），不能用 $host（去端口）——SigV4 把客户端请求的
    # Host 头逐字节算进签名，带端口的部署下 $host 会让 MinIO 校验失败。
    # 集成脚本 server/scripts/delivery-storage-integration.ts 曾据此抓出该缺陷。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Self-hosted object storage. The VPS compose overlay runs MinIO on the
  # private Compose network and configures STORAGE_PUBLIC_URL_BASE as
  # https://<site>/uploads. Keep MinIO off the public network while browsers
  # still receive cacheable image URLs from the same origin.
  #
  # A variable plus Docker's embedded resolver keeps the base web image usable
  # for deployments that do not enable the optional `selfhost-storage` profile.
  # STORAGE_BUCKET is expanded from the container environment at startup.
  location ~ ^/uploads/(?<object_key>.+)$ {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $minio_host minio;
    proxy_pass http://$minio_host:9000/$STORAGE_BUCKET/$object_key;
    proxy_http_version 1.1;
    # Uploads are magic-byte validated before storage. Preserve that boundary
    # at the public reverse proxy so browsers never MIME-sniff a blob that is
    # served from the application origin.
    add_header Content-Security-Policy $monexus_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # SEC-06: storage error bodies name the bucket, resource path and host id,
    # and its headers identify the implementation (and duplicate ours). Hide
    # them and answer errors in the API's JSON shape instead.
    proxy_hide_header X-Amz-Id-2;
    proxy_hide_header X-Amz-Request-Id;
    proxy_hide_header X-Ratelimit-Limit;
    proxy_hide_header X-Ratelimit-Remaining;
    proxy_hide_header X-Xss-Protection;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_intercept_errors on;
    error_page 400 403 404 = @upload_not_found;
    error_page 500 502 503 504 = @upload_unavailable;
    access_log /var/log/nginx/access.log monexus_uploads;
  }

  location @upload_not_found {
    # Empty types: the object key's extension (.png) must not pick the type.
    types { }
    default_type application/json;
    add_header Content-Security-Policy $monexus_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    add_header X-Request-Id $request_id always;
    access_log /var/log/nginx/access.log monexus_uploads;
    return 404 '{"requestId":"$request_id","error":{"code":"NOT_FOUND","message":"资源不存在"}}';
  }

  location @upload_unavailable {
    types { }
    default_type application/json;
    add_header Content-Security-Policy $monexus_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    add_header X-Request-Id $request_id always;
    access_log /var/log/nginx/access.log monexus_uploads;
    return 503 '{"requestId":"$request_id","error":{"code":"STORAGE_UNAVAILABLE","message":"文件服务暂不可用，请稍后重试"}}';
  }

  # SPA fallback — any unknown path serves index.html so React Router
  # can handle client-side routing.
  location / {
    add_header Content-Security-Policy $monexus_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri $uri/ /index.html;
  }

  # The entry document must be revalidated: a cached copy after a release
  # references hashed chunks that the new image no longer ships. "/" and the
  # SPA fallback both reach this location through an internal redirect.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $monexus_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri =404;
  }

  # Don't log noisy probes
  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }
}
