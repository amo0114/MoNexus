name: Set up Ubuntu package mirrors
description: Prefer the official Ubuntu archives over the slow hosted-runner Azure mirror, keeping the mirror when they are unresolvable.
runs:
  using: composite
  steps:
    - name: Configure official Ubuntu archives
      shell: bash
      run: |
        set -euo pipefail
        # The official archives only work around slow Azure mirror downloads;
        # when the runner cannot resolve them, keep the image default instead
        # of failing every apt install.
        if getent hosts archive.ubuntu.com >/dev/null && getent hosts security.ubuntu.com >/dev/null; then
          # Hosted images can use either direct URIs or mirror+file URIs.
          # Configure before Playwright install-deps as well as our apt installs.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo sed -i \
              -e 's|mirror+file:/etc/apt/apt-mirrors-security\.txt|https://security.ubuntu.com/ubuntu|g' \
              -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "$source"
          done
        else
          echo "::warning::Official Ubuntu archives are not resolvable; keeping the hosted runner mirror."
        fi
        # Bound stalled connections and retry transient failures. Keep apt's
        # signed metadata/package checks and the existing job time budgets.
        printf '%s\n' \
          'Acquire::Retries "3";' \
          'Acquire::http::Timeout "30";' \
          'Acquire::https::Timeout "30";' \
          | sudo tee /etc/apt/apt.conf.d/80-monexus-ci-network >/dev/null
