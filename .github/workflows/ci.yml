# CI matrix under the master/develop branching model:
#
#   PR -> develop  (feat/fix/chore)  path-filtered backend & frontend jobs;
#                                    E2E only when e2e files changed or the
#                                    PR carries the `run-e2e` label.
#   push -> develop (post-merge)     full suite incl. E2E — integration gate,
#                                    which is what makes the PR-level E2E
#                                    opt-in safe.
#   PR -> master   (release/hotfix)  full suite incl. E2E — production gate.
#   push -> master                   full suite (docker-publish runs alongside).
#
# Docs-only changes skip every heavy job; the aggregate "CI OK" job still
# reports success so it can be the single required status check on both
# protected branches. Do NOT use [skip ci] on PR branches: it suppresses the
# whole workflow, so the required "CI OK" check stays Pending forever and the
# PR cannot merge — path filtering already makes docs-only PRs finish fast.
#
# Scheduling: the backend suite runs as 3 file-level shards, and both
# Playwright jobs are self-contained (own dependencies, DB service and
# backend build), so they run in parallel with the backend shards instead
# of after them. "CI OK" aggregates every result, so the parallelism does
# not weaken the gate. See docs/testing-policy.md for the layering policy.

name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pushes to master/develop always run the full suite; path filtering
    # only trims PR runs.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - '.github/workflows/ci.yml'
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'playwright.legal-pages.config.ts'
              - 'playwright.notification-realtime.config.ts'
              - 'playwright.catalog-ops.config.ts'
              - 'scripts/verify-notification-realtime-e2e.sh'
              - 'scripts/verify-catalog-ops-e2e.sh'
              # Workflow edits change how the E2E jobs themselves run, so
              # they must prove the restructured pipeline on the PR itself.
              - '.github/workflows/ci.yml'
            code:
              - 'server/**'
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'playwright.notification-realtime.config.ts'
              - 'playwright.catalog-ops.config.ts'
              - 'scripts/verify-notification-realtime-e2e.sh'
              - 'scripts/verify-catalog-ops-e2e.sh'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend build and test
    needs: changes
    # !failure() && !cancelled(): on push the `changes` job is skipped and a
    # plain `needs` would propagate that skip.
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'push' ||
        needs.changes.outputs.server == 'true'
      )
    runs-on: ubuntu-latest
    # The full real-PostgreSQL suite is serial by design (singleFork) and
    # takes ~13 minutes on a single runner, so it is split into 3 file-level
    # shards, each against its own PostgreSQL service. setup.ts TRUNCATEs
    # every table before each test, so shards share no cross-file state.
    # Per-shard runtime is ~6 minutes; keep a bounded margin for runner/IO
    # variance — individual Vitest timeouts still detect hung tests.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monexus
          POSTGRES_PASSWORD: monexus_dev_2026
          POSTGRES_DB: monexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monexus -d monexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
      TEST_DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-xx
      FRONTEND_ORIGIN: http://localhost:5173
      # 全局 /api limiter 无测试跳过（app.ts），全量套件单进程共享计数，
      # 默认 300 次/15 分钟会从第 301 个请求起整片 429；这个 CI 后端
      # 测试作业保持独立的测试上限，不改变生产默认值。
      API_RATE_LIMIT_MAX: 3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Apply database migrations
        run: npm --prefix server run db:migrate:deploy

      - name: Build backend
        run: npm --prefix server run build

      - name: Install pandoc for spec DOCX checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Test backend (shard ${{ matrix.shard }}/3)
        run: npm --prefix server test -- --shard=${{ matrix.shard }}/3

  frontend:
    name: Frontend typecheck and build
    needs: changes
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'push' ||
        needs.changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e:
    name: Playwright E2E
    # Deliberately NOT gated on the backend job: this job installs its own
    # dependencies, owns its own PostgreSQL service and builds the backend
    # itself, so it runs concurrently with the backend shards instead of
    # queueing behind them. "CI OK" still requires every job to be green,
    # so gating strength is unchanged; the only cost is some wasted runner
    # minutes when backend tests fail.
    needs: [changes, frontend]
    # Runs on: any push to master/develop; PRs to master that touch code;
    # PRs to develop only when e2e files changed or the `run-e2e` label is
    # set (the post-merge push to develop still runs the full suite).
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'push' ||
        (github.base_ref == 'master' && needs.changes.outputs.code == 'true') ||
        needs.changes.outputs.e2e == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'run-e2e')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monexus
          POSTGRES_PASSWORD: monexus_dev_2026
          POSTGRES_DB: monexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monexus -d monexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
      TEST_DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-xx
      FRONTEND_ORIGIN: http://localhost:5173
      # E2E shares one test client across the full suite; this test-only
      # headroom prevents aggregate /api traffic from ending in 429.
      API_RATE_LIMIT_MAX: 10000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Apply database migrations
        run: npm --prefix server run db:migrate:deploy

      - name: Generate temporary E2E MFA factor
        run: |
          node <<'NODE'
          const { randomBytes } = require('node:crypto')
          const { appendFileSync } = require('node:fs')

          const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'
          const bytes = randomBytes(20)
          let factor = ''
          let buffer = 0
          let bits = 0
          for (const byte of bytes) {
            buffer = (buffer << 8) | byte
            bits += 8
            while (bits >= 5) {
              factor += alphabet[(buffer >>> (bits - 5)) & 31]
              bits -= 5
            }
            buffer &= (1 << bits) - 1
          }
          if (bits > 0) factor += alphabet[(buffer << (5 - bits)) & 31]
          if (factor.length !== 32) throw new Error('E2E TOTP factor generation failed')

          appendFileSync(process.env.GITHUB_ENV, [
            `MFA_ENCRYPTION_KEY=${randomBytes(32).toString('base64')}`,
            `E2E_ADMIN_MFA_TOTP_SECRET=${factor}`,
          ].join('\n') + '\n')
          NODE

      - name: Seed E2E fixtures
        run: npm --prefix server run db:seed:force

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build backend
        run: npm --prefix server run build

      # legal-pages.spec.ts owns an enabled + enforce server pair. Run it
      # before the shared 3000/5173 compatibility stack is started: this
      # avoids carrying long-lived default-stack processes across the
      # feature-specific database reset and startup boundary.
      - name: Run Legal Pages E2E tests
        run: npm run e2e:legal
        env:
          LEGAL_E2E_DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public

      # The legal suite creates orders and registrations while enforce mode
      # is active. Restore the fresh compatibility fixture before starting
      # the default stack, whose contract deliberately keeps legal pages off.
      - name: Reset database for default E2E
        working-directory: server
        run: |
          npx prisma migrate reset --force --skip-seed
          npm run db:seed:force

      - name: Start backend
        run: npm --prefix server run dev &
        env:
          # E2E reuses fixed seed accounts across the full suite. Keep the
          # server in its explicit test mode so auth's password-guessing
          # limiter cannot turn the final test into a shared-IP false 429.
          NODE_ENV: test
          DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-xx
          FRONTEND_ORIGIN: http://localhost:5173
          PORT: 3000

      - name: Start frontend
        run: npm run dev -- --host 127.0.0.1 &
        env:
          # Browser traffic reaches the API through Vite over IPv4. The
          # Playwright request fixture uses IPv6 below, so two synthetic
          # clients do not incorrectly share one production per-IP bucket.
          VITE_API_PROXY_TARGET: http://127.0.0.1:3000

      - name: Wait for servers
        run: |
          for url in http://127.0.0.1:3000/api/health http://127.0.0.1:5173; do
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then
                echo "$url is ready"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::$url did not become ready in time"
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: 'true'
          E2E_BASE_URL: http://127.0.0.1:5173
          # Keep API fixture traffic on a distinct loopback client address;
          # API_RATE_LIMIT_MAX is raised for aggregate E2E traffic only;
          # no limiter is bypassed and production defaults are unchanged.
          E2E_API_URL: 'http://[::1]:3000'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  notification-realtime-e2e:
    name: Notification realtime Playwright E2E
    # Keep the realtime suite visible as an independent gate. It follows the
    # same PR/push selection as the compatibility E2E job, but never shares
    # that job's database, ports, server processes, retries, or artifacts.
    # Like the compatibility job it is self-contained, so it does not queue
    # behind the backend shards either.
    needs: [changes, frontend]
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'push' ||
        (github.base_ref == 'master' && needs.changes.outputs.code == 'true') ||
        needs.changes.outputs.e2e == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'run-e2e')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monexus
          POSTGRES_PASSWORD: monexus_dev_2026
          POSTGRES_DB: monexus_test_notification_realtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monexus -d monexus_test_notification_realtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test_notification_realtime?schema=public
      TEST_DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test_notification_realtime?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Create guarded realtime E2E environment
        run: |
          umask 077
          RT_ENV_FILE="$RUNNER_TEMP/notification-realtime.env"
          printf '%s\n' "TEST_DATABASE_URL=${TEST_DATABASE_URL}" > "$RT_ENV_FILE"
          printf '%s\n' "RT_ENV_FILE=$RT_ENV_FILE" >> "$GITHUB_ENV"

      - name: Run notification realtime E2E tests
        run: bash scripts/verify-notification-realtime-e2e.sh

  catalog-ops-e2e:
    name: Catalog-ops integration Playwright E2E
    # Dedicated-stack suite for the Catalog/Merch integration lane (PAR-CMI-001).
    # The four catalog-ops specs own a fixed topology (API 3105 / Vite 5180 /
    # Xboard fixture 3106) and the disposable DB monexus_test_catalog_merch_integration;
    # the merchandising smoke additionally REQUIRES a fresh DB per run (placement
    # partial-unique conflicts with a leftover active campaign). Folding them into
    # the shared compatibility job's single DB would break that determinism and
    # risk cross-spec pollution, so they run only via playwright.catalog-ops.config.ts
    # here, mirroring scripts/verify-catalog-ops-e2e.sh 1:1. Like the other Playwright
    # jobs it is self-contained and runs in parallel with the backend shards.
    needs: [changes, frontend]
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'push' ||
        (github.base_ref == 'master' && needs.changes.outputs.code == 'true') ||
        needs.changes.outputs.e2e == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'run-e2e')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monexus
          POSTGRES_PASSWORD: monexus_dev_2026
          POSTGRES_DB: monexus_test_catalog_merch_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monexus -d monexus_test_catalog_merch_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test_catalog_merch_integration?schema=public
      TEST_DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test_catalog_merch_integration?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install PostgreSQL client (dbguard lifecycle)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run catalog-ops integration E2E tests
        run: bash scripts/verify-catalog-ops-e2e.sh

  deployment-contract:
    # This is intentionally independent of source-path filtering: a malformed
    # workflow or forced-command wrapper must not reach the release branch just
    # because the surrounding change is documentation or operations-only.
    name: Compose production deploy contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment scripts and workflow safeguards
        run: npm run verify:compose-production-deploy

  ci-ok:
    # Single required status check for branch protection: succeeds when no
    # upstream job failed — skipped jobs (docs-only or unlabeled-E2E PRs)
    # count as success.
    name: CI OK
    needs: [changes, backend, frontend, e2e, notification-realtime-e2e, catalog-ops-e2e, deployment-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check upstream job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::At least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "All upstream jobs succeeded or were intentionally skipped"
