# CI matrix under the master/develop branching model:
#
#   PR -> develop  (feat/fix/chore)  path-filtered backend & frontend jobs;
#                                    E2E only when e2e files changed or the
#                                    PR carries the `run-e2e` label.
#   push -> develop (post-merge)     full suite incl. E2E — integration gate,
#                                    which is what makes the PR-level E2E
#                                    opt-in safe.
#   PR -> master   (release/hotfix)  full suite incl. E2E — production gate.
#   push -> master                   full suite (docker-publish runs alongside).
#
# Docs-only changes skip every heavy job; the aggregate "CI OK" job still
# reports success so it can be the single required status check on both
# protected branches. Do NOT use [skip ci] on PR branches: it suppresses the
# whole workflow, so the required "CI OK" check stays Pending forever and the
# PR cannot merge — path filtering already makes docs-only PRs finish fast.

name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pushes to master/develop always run the full suite; path filtering
    # only trims PR runs.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - '.github/workflows/ci.yml'
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
            code:
              - 'server/**'
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - 'e2e/**'
              - 'playwright.config.ts'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend build and test
    needs: changes
    # !failure() && !cancelled(): on push the `changes` job is skipped and a
    # plain `needs` would propagate that skip.
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'push' ||
        needs.changes.outputs.server == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monexus
          POSTGRES_PASSWORD: monexus_dev_2026
          POSTGRES_DB: monexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monexus -d monexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
      TEST_DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-xx
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Apply database migrations
        run: npm --prefix server run db:migrate:deploy

      - name: Build backend
        run: npm --prefix server run build

      - name: Test backend
        run: npm --prefix server test

  frontend:
    name: Frontend typecheck and build
    needs: changes
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'push' ||
        needs.changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: [changes, backend, frontend]
    # Runs on: any push to master/develop; PRs to master that touch code;
    # PRs to develop only when e2e files changed or the `run-e2e` label is
    # set (the post-merge push to develop still runs the full suite).
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'push' ||
        (github.base_ref == 'master' && needs.changes.outputs.code == 'true') ||
        needs.changes.outputs.e2e == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'run-e2e')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: monexus
          POSTGRES_PASSWORD: monexus_dev_2026
          POSTGRES_DB: monexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monexus -d monexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
      TEST_DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-xx
      FRONTEND_ORIGIN: http://localhost:5173
      API_RATE_LIMIT_MAX: 3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Generate Prisma client
        run: npm --prefix server run db:generate

      - name: Apply database migrations
        run: npm --prefix server run db:migrate:deploy

      - name: Generate temporary E2E MFA factor
        run: |
          node <<'NODE'
          const { randomBytes } = require('node:crypto')
          const { appendFileSync } = require('node:fs')

          const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'
          const bytes = randomBytes(20)
          let factor = ''
          let buffer = 0
          let bits = 0
          for (const byte of bytes) {
            buffer = (buffer << 8) | byte
            bits += 8
            while (bits >= 5) {
              factor += alphabet[(buffer >>> (bits - 5)) & 31]
              bits -= 5
            }
            buffer &= (1 << bits) - 1
          }
          if (bits > 0) factor += alphabet[(buffer << (5 - bits)) & 31]
          if (factor.length !== 32) throw new Error('E2E TOTP factor generation failed')

          appendFileSync(process.env.GITHUB_ENV, [
            `MFA_ENCRYPTION_KEY=${randomBytes(32).toString('base64')}`,
            `E2E_ADMIN_MFA_TOTP_SECRET=${factor}`,
          ].join('\n') + '\n')
          NODE

      - name: Seed E2E fixtures
        run: npm --prefix server run db:seed:force

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: npm --prefix server run build

      - name: Start backend
        run: npm --prefix server run dev &
        env:
          # E2E reuses fixed seed accounts across the full suite. Keep the
          # server in its explicit test mode so auth's password-guessing
          # limiter cannot turn the final test into a shared-IP false 429.
          NODE_ENV: test
          DATABASE_URL: postgresql://monexus:monexus_dev_2026@localhost:5432/monexus_test?schema=public
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-xx
          FRONTEND_ORIGIN: http://localhost:5173
          PORT: 3000

      - name: Start frontend
        run: npm run dev -- --host 127.0.0.1 &

      - name: Wait for servers
        run: |
          for url in http://127.0.0.1:3000/api/health http://127.0.0.1:5173; do
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then
                echo "$url is ready"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "::error::$url did not become ready in time"
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: 'true'
          E2E_BASE_URL: http://127.0.0.1:5173

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ci-ok:
    # Single required status check for branch protection: succeeds when no
    # upstream job failed — skipped jobs (docs-only or unlabeled-E2E PRs)
    # count as success.
    name: CI OK
    needs: [changes, backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check upstream job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::At least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "All upstream jobs succeeded or were intentionally skipped"
