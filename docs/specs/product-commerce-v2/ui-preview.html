<body>
  <header class="toolbar">
    <div class="toolbar-top"><strong>MoNexus · 商品体验设计</strong><a href="spec.md" style="color:#c7d2fe;font-size:12px">阅读完整规格 ↗</a></div>
    <p>交互线框 · 示例数据 · 未连接后端。用于审阅信息顺序、编辑选项和响应式布局。</p>
    <div class="controls">
      <label>页面 <select id="view"><option value="detail">商品详情</option><option value="editor">商品编辑</option><option value="admin">管理员系统信息</option></select></label>
      <label>形态 <select id="template"></select></label>
      <button id="width" type="button">切换手机 390px</button>
      <button id="theme" type="button">切换深色</button>
      <label>可见性 <select id="visibility"><option value="members_only">仅登录可见</option><option value="public">游客可见</option></select></label><label><input id="locked" type="checkbox">游客视角</label>
    </div>
  </header>
  <div class="note">这里的示例版本、套餐与图片只用于布局。图文、保障、价格和交付承诺以 spec.md 的服务端契约为准。</div>
  <main class="stage"><div id="frame" class="frame"><div id="screen"></div></div></main>
  <div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div>

{
  "specification": "SPEC-PRODUCT-COMMERCE-002",
  "registryVersion": 1,
  "description": "冻结设计资产；示例不代表真实商品或种子数据。UI 通过 registry 消费字段定义，验证器不隐式填默认值。",

    {
      "key": "redemption_code",
      "version": 1,
      "label": "卡密与兑换码",
      "productSchema": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "urn:monexus:product-template:redemption_code:v1:product",
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "serviceName": {
            "type": "string",
            "title": "适用产品",
            "minLength": 1,
            "maxLength": 100
          },
          "region": {
            "type": "string",
            "title": "适用地区",
            "minLength": 1,
            "maxLength": 100
          },
          "redemptionMethod": {
            "type": "string",
            "title": "兑换方式",
            "minLength": 1,
            "maxLength": 1000
          }
        },
        "required": [
          "serviceName",
          "redemptionMethod"
        ]
      },
      "offerSchema": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "urn:monexus:product-template:redemption_code:v1:offer",
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "unitLabel": {
            "type": "string",
            "title": "销售单位",
            "minLength": 1,
            "maxLength": 40
          },
          "faceValueLabel": {
            "type": "string",
            "title": "面值或授权范围",
            "minLength": 1,
            "maxLength": 100
          }
        },
        "required": [
          "unitLabel"
        ]
      },
      "ui": {
        "productOrder": [
          "serviceName",
          "region",
          "redemptionMethod"
        ],
        "offerOrder": [
          "unitLabel",
          "faceValueLabel"
        ],
        "widgets": {
          "serviceName": "text",
          "region": "text",
          "redemptionMethod": "textarea",
          "unitLabel": "text",
          "faceValueLabel": "text"
        }
      },
      "examples": {
        "product": {
          "serviceName": "示例软件",
          "region": "全球",
          "redemptionMethod": "在软件的兑换入口输入卡密。"
        },
        "offer": {
          "unitLabel": "1 个兑换码",
          "faceValueLabel": "个人版授权"
        }
      },
      "fulfillmentRules": [
        {
          "whenProductAttributes": {},
          "configurations": [
            "inventory"
          ],
          "requireStructuredDelivery": "none",
          "requireRequiredDateField": false
        }
      ]
    },
    {
      "key": "account",
      "version": 1,
      "label": "账号商品",
      "productSchema": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "urn:monexus:product-template:account:v1:product",
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "serviceName": {
            "type": "string",
            "title": "适用服务",
            "minLength": 1,
            "maxLength": 100

          "accessModel": {
            "type": "string",
            "title": "账号使用方式",
            "enum": [
              "exclusive",
              "shared"
            ]
          },
          "usageRestrictions": {
            "type": "string",
            "title": "使用限制",
            "minLength": 1,
            "maxLength": 1000
          }
        },
        "required": [
          "serviceName",
          "accessModel",
          "usageRestrictions"
        ]
      },
      "offerSchema": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",

        "type": "object",
        "additionalProperties": false,
        "properties": {
          "accountTier": {
            "type": "string",
            "title": "账号权益",
            "minLength": 1,
            "maxLength": 200
          }
        },
        "required": [
          "accountTier"
        ]
      },
      "ui": {
        "productOrder": [
          "serviceName",
          "accessModel",
          "usageRestrictions"
        ],
        "offerOrder": [
          "accountTier"
        ],
        "widgets": {
          "serviceName": "text",
          "accessModel": "select",
          "usageRestrictions": "textarea",
          "accountTier": "text"

          "accessModel": {
            "exclusive": "独享账号",
            "shared": "共享账号"

      },

        "product": {
          "serviceName": "示例服务",

            "maxLength": 1000

  <script>

    let modalTrigger=null;function closeModal(){const trigger=modalTrigger;$('overlay').innerHTML='';$('frame').inert=false;document.querySelector('.toolbar').inert=false;trigger?.focus()}

15px">商家售后说明与平台规则分别展示。没有有效授权时，此保障区域不出现。</p></section><section class="section"><h2>用户评价</h2><p class="muted">暂无评价，兑换后可分享使用体验。</p></section></div></div><aside class="purchase card"><div class="label">选择套餐</div><div class="offer-stack">${['基础套餐','进阶套餐'].map((n,i)=>`<button type="button" class="offer ${selectedOffer===i?'selected':''}" data-offer="${i}" aria-pressed="${selectedOffer===i}"><span>${n}<small>${i?'更多服务内容':'满足基础需要'}</small></span><b>${i?360:120} 积分</b></button>`).join('')}</div><div class="price">${price}<span>积分</span></div><dl><dt>交付方式</dt><dd>${p.delivery}</dd><dt>有效期</dt><dd>${p.period}</dd><dt>购买数量</dt><dd>1 个套餐单位</dd></dl><button type="button" class="primary buy" data-buy>${$('locked').checked?'登录后兑换':'立即兑换'}</button><p class="footnote">确认时将再次核对套餐、价格与购买条款。</p><div class="provider"><div class="avatar">M</div><div><strong>MoNexus 自营</strong><small>平台提供商品与服务</small></div></div></aside></div></div><div class="mobile-buy"><div class="price">${price}<span>积分</span></div><button type="button" class="primary" data-buy>${$('locked').checked?'登录后兑换':'立即兑换'}</button></div>`;
    }
    function attributeFields(t){return Object.entries(t.productSchema.properties).map(([key,s])=>{const v=t.examples.product[key]??'';const required=t.productSchema.required.includes(key);const input=s.enum?`<select aria-label="${escapeHtml(s.title)}">${s.enum.map(x=>`<option ${x===v?'selected':''}>${escapeHtml(t.ui.enumLabels?.[key]?.[x]??x)}</option>`).join('')}</select>`:s.maxLength>=500?`<textarea aria-label="${escapeHtml(s.title)}">${escapeHtml(v)}</textarea>`:`<input aria-label="${escapeHtml(s.title)}" value="${escapeHtml(Array.isArray(v)?v.join('、'):v)}">`;return `<label class="field ${s.maxLength>=500?'wide':''}"><span>${escapeHtml(s.title)}${required?'<b class="req">*</b>':''}</span>${input}</label>`}).join('')}
    function editor(t){const p=profiles[t.key];return header()+`<div class="content"><div class="breadcrumbs">商品管理 / 编辑商品</div><div class="editor-head"><div><h1>把商品说明清楚</h1><p class="muted" style="font-size:13px;margin:0">草稿 · ${t.label} · 本页为编辑选项示例</p></div><div class="editor-actions"><button type="button" data-preview>预览商品</button><button class="primary" type="button" data-save>保存草稿</button></div></div><div class="steps"><span>1 商品形态</span><span class="current">2 展示信息</span><span>3 套餐与交付</span><span>4 购买资料</span><span>5 可售资源</span><span>6 发布检查</span></div><div class="editor-grid"><div class="edit-main"><section class="card"><h2>基本信息</h2><div class="cover-upload"><div class="cover-mini"></div><div><strong>商品封面与图集</strong><small>上传、替换与排序 · 使用平台托管图片</small></div></div><div class="fields"><label class="field wide"><span>商品名称 <b class="req">*</b></span><input value="${p.name}"></label><label class="field wide"><span>一句话简介 <b class="req">*</b></span><textarea>${p.sub}</textarea><small>建议 40–140 字，说明适合谁、能获得什么。</small></label></div></section><section class="card"><h2>${t.label}参数</h2><div class="fields">${attributeFields(t)}</div></section><section class="card"><h2>图文介绍</h2>${t.key==='subscription'?'<div class="source" style="margin-bottom:18px"><span><strong>Xboard 来源介绍</strong><br>本地编辑独立保存，上游变化由你预览后采纳。</span><button type="button" data-source>检查上游介绍</button></div>':''}<div class="rich-tools" role="toolbar" aria-label="编辑器工具栏">${['撤销','重做','段落 ▾','B','I','列表','引用','链接','图片','清除格式'].map(s=>`<button type="button" data-tool>${s}</button>`).join('')}</div><div class="rich-edit" contenteditable="true" role="textbox" aria-label="图文正文" aria-multiline="true"><strong>适用范围与使用方式</strong><p>在这里补充商品的详细说明。套餐价格、有效期和交付内容在各自区域维护。</p></div></section><section class="card"><h2>购买须知与售后</h2><div class="fields"><label class="field wide"><span>购买须知 <b class="req">*</b></span><textarea placeholder="例如适用地区、使用条件和兑换前需要了解的限制"></textarea></label><label class="field wide"><span>商家售后说明 <b class="req">*</b></span><textarea placeholder="说明遇到问题时的处理方式，不覆盖平台退款规则"></textarea></label></div></section><section class="card"><h2>谁可以浏览这件商品</h2><label class="radio-line"><input type="radio" name="visibility" checked><span><strong>仅登录后可浏览</strong><br><small class="muted">游客打开分享链接后，需要先登录。</small></span></label><label class="radio-line"><input type="radio" name="visibility"><span><strong>游客可浏览商品信息</strong><br><small class="muted">兑换仍需要登录。</small></span></label></section><section class="card"><h2>平台保障</h2><p class="muted" style="font-size:13px">提交申请后由管理员审核。平台协助售后与争议处理，不另作先行垫付承诺。</p><button type="button" data-assurance>查看申请条件</button></section></div><aside class="card"><h3>发布前检查</h3><ul class="checklist"><li class="done">已选择商品形态</li><li class="done">已填写基本信息</li><li class="todo">补充购买须知与售后</li><li class="todo">完成套餐与交付配置</li><li class="todo">准备可售资源</li></ul><p class="context-note">保存草稿不会自动发布。发布前将由服务端检查商品与套餐是否准备就绪。</p><button type="button" disabled style="width:100%">发布到商城</button></aside></div></div>`}
    function admin(){return header()+`<div class="content"><div class="breadcrumbs">管理后台 / 系统设置</div><div class="admin-grid"><nav class="admin-nav" aria-label="管理设置"><span>基础设置</span><span>注册与安全</span><span>存储与交付</span><span class="active">系统信息</span></nav><section><h1 style="font-size:26px">系统信息</h1><p class="muted" style="font-size:14px">查看当前运行的 API 构建信息。</p><div class="card"><span class="pill">生产环境 · 原型示例</span><div class="version-number">v1.2.3</div><p class="muted" style="font-size:13px">版本来自构建产物，不能在后台手动修改。</p><div class="info-table"><span>完整提交</span><span>0123456789abcdef0123456789abcdef01234567</span><span>构建时间</span><span>2026-09-09 16:00（UTC+8）</span><span>发行标签</span><span>v1.2.3</span><span>信息来源</span><span>运行镜像的构建产物</span></div></div><p class="muted" style="font-size:12px;margin-top:16px">此页仅管理员可访问。未提供构建产物时显示缺失状态，不用固定版本号代替。</p></section></div></div>`}
    function render(){const t=templates.find(t=>t.key===$('template').value);$('screen').innerHTML=$('view').value==='detail'?details(t):$('view').value==='editor'?editor(t):admin();if($('share'))$('share').onclick=share;document.querySelectorAll('[data-offer]').forEach(el=>el.onclick=()=>{selectedOffer=Number(el.dataset.offer);render()});document.querySelectorAll('[data-buy]').forEach(el=>el.onclick=()=>toast('原型演示：此处进入既有结算确认流程'));document.querySelectorAll('[data-save]').forEach(el=>el.onclick=()=>toast('原型未连接后端，没有保存数据'));document.querySelectorAll('[data-preview]').forEach(el=>el.onclick=()=>{$('view').value='detail';render()});document.querySelectorAll('[data-login]').forEach(el=>el.onclick=()=>toast('原型演示：登录后安全返回原商品'));document.querySelectorAll('[data-tool]').forEach(el=>el.onclick=()=>toast('工具栏位置示意；实现使用统一可视化编辑器'));document.querySelectorAll('[data-assurance]').forEach(el=>el.onclick=()=>toast('已发布且正常经营的商品可申请，由管理员审核'));document.querySelectorAll('[data-source]').forEach(el=>el.onclick=()=>modal('预览上游介绍','<p>这里对比当前已保存内容与最新上游介绍。按字段选择采纳，普通同步不会覆盖本地编辑。</p><label class="radio-line"><input type="checkbox">采纳上游简介</label><label class="radio-line"><input type="checkbox">采纳上游正文</label><p>示意：提交时重验源内容与本地版本。</p>','<button type="button" disabled>替换已选内容</button>'))}
    $('view').onchange=render;$('template').onchange=()=>{selectedOffer=0;render()};$('locked').onchange=render;$('visibility').onchange=render;$('width').onclick=()=>{mobile=!mobile;$('frame').classList.toggle('mobile',mobile);$('width').textContent=mobile?'切换桌面':'切换手机 390px'};$('theme').onclick=()=>{dark=!dark;$('frame').classList.toggle('dark',dark);$('theme').textContent=dark?'切换浅色':'切换深色'};document.addEventListener('keydown',e=>{if(!$('overlay').firstElementChild)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const items=[...$('overlay').querySelectorAll('button:not(:disabled),textarea,input')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
  </script>
</body>
</html>
